<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_USBCMultiPortHub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06091e" />
      <stop offset="100%" stop-color="#0b112c" />
    </linearGradient>
    <linearGradient id="accentGrad_USBCMultiPortHub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow_USBCMultiPortHub" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad_USBCMultiPortHub)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Grid Accent -->
  <pattern id="grid_USBCMultiPortHub" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4" />
  </pattern>
  <rect width="400" height="300" rx="16" fill="url(#grid_USBCMultiPortHub)" />

  <!-- Outer Glow Ring -->
  <circle cx="200" cy="130" r="65" fill="#3b82f6" opacity="0.15" filter="url(#glow_USBCMultiPortHub)" />

  <!-- Center Product Icon Container -->
  <rect x="135" y="65" width="130" height="130" rx="24" fill="#030612" stroke="url(#accentGrad_USBCMultiPortHub)" stroke-width="2" opacity="0.95" />
  
  <!-- Product SVG Icon -->
  <g transform="translate(160, 90)" fill="none" stroke="url(#accentGrad_USBCMultiPortHub)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="20" width="48" height="40" rx="8"/><path d="M40 60 L40 72 L32 72"/><rect x="24" y="28" width="8" height="12" rx="2"/><rect x="36" y="28" width="8" height="12" rx="2"/><rect x="48" y="28" width="8" height="12" rx="2"/>
  </g>

  <!-- Category Badge -->
  <rect x="150" y="210" width="100" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="200" y="225" font-family="monospace" font-size="10" font-weight="bold" fill="#06b6d4" text-anchor="middle" letter-spacing="1">ACCESSORIES</text>

  <!-- Product Title -->
  <text x="200" y="255" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">USB-C Multi-Port Hub</text>
</svg>