<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_MonitorLightBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06091e" />
      <stop offset="100%" stop-color="#0b112c" />
    </linearGradient>
    <linearGradient id="accentGrad_MonitorLightBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow_MonitorLightBar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad_MonitorLightBar)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Grid Accent -->
  <pattern id="grid_MonitorLightBar" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4" />
  </pattern>
  <rect width="400" height="300" rx="16" fill="url(#grid_MonitorLightBar)" />

  <!-- Outer Glow Ring -->
  <circle cx="200" cy="130" r="65" fill="#f59e0b" opacity="0.15" filter="url(#glow_MonitorLightBar)" />

  <!-- Center Product Icon Container -->
  <rect x="135" y="65" width="130" height="130" rx="24" fill="#030612" stroke="url(#accentGrad_MonitorLightBar)" stroke-width="2" opacity="0.95" />
  
  <!-- Product SVG Icon -->
  <g transform="translate(160, 90)" fill="none" stroke="url(#accentGrad_MonitorLightBar)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="16" width="72" height="10" rx="5" fill="#f59e0b"/><line x1="40" y1="26" x2="40" y2="50"/><rect x="30" y="50" width="20" height="16" rx="4"/>
  </g>

  <!-- Category Badge -->
  <rect x="150" y="210" width="100" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="200" y="225" font-family="monospace" font-size="10" font-weight="bold" fill="#eab308" text-anchor="middle" letter-spacing="1">ACCESSORIES</text>

  <!-- Product Title -->
  <text x="200" y="255" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Monitor Light Bar</text>
</svg>